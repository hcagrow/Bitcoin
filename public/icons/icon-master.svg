<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7e14ff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- threshold band (기준선) -->
  <rect x="96" y="252" width="320" height="52" rx="4" fill="#ffffff" opacity="0.16"/>
  <line x1="96" y1="278" x2="416" y2="278" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 12" opacity="0.55"/>

  <!-- candlesticks, rising through the band -->
  <g stroke="#ffffff" stroke-linecap="round">
    <line x1="150" y1="330" x2="150" y2="380" stroke-width="6" opacity="0.9"/>
    <rect x="134" y="345" width="32" height="24" rx="4" fill="#ffffff" opacity="0.9"/>

    <line x1="230" y1="288" x2="230" y2="342" stroke-width="6" opacity="0.95"/>
    <rect x="214" y="300" width="32" height="30" rx="4" fill="#ffffff" opacity="0.95"/>

    <line x1="310" y1="216" x2="310" y2="300" stroke-width="7" opacity="1"/>
    <rect x="292" y="232" width="36" height="46" rx="5" fill="#ffffff"/>

    <line x1="390" y1="150" x2="390" y2="238" stroke-width="7" opacity="1"/>
    <rect x="372" y="168" width="36" height="50" rx="5" fill="#ffffff"/>
  </g>
</svg>
