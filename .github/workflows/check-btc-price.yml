name: Check BTC price

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current BTC price from Binance
        run: |
          echo "Checked at (UTC): $(date -u +%FT%TZ)"
          curl -s "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT"
