name: Check BTC price

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: Fetch current BTC price from CoinGecko
        run: |
          curl -s "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true" -o data.json
          cat data.json

      - name: Commit result to data branch
        run: |
          git config user.name "btc-price-bot"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update BTC price $(date -u +%FT%TZ)" || echo "No changes to commit"
          git push origin data
