name: Check BTC price

on:
  workflow_dispatch: {}
  # Runs on GitHub's own servers, unaffected by this session's own network
  # restrictions — so a scheduled run's log always has a price no older
  # than ~15 minutes, readable anytime without needing to dispatch a new
  # run first. No repo writes here (no commits, no new branch, no elevated
  # permissions) — the job log itself is the record.
  schedule:
    - cron: '*/15 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current BTC price from CoinGecko
        run: |
          echo "Checked at (UTC): $(date -u +%FT%TZ)"
          curl -s "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true"
