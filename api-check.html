<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>가격 API 체크</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.55; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .test { border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .test h2 { font-size: 15px; margin: 0 0 2px; }
  .url { font-size: 11px; color: #888; word-break: break-all; margin-bottom: 8px; }
  .status { font-weight: bold; padding: 2px 10px; border-radius: 4px; display: inline-block; font-size: 13px; }
  .pending { background: #eee; color: #555; }
  .ok { background: #d4f4dd; color: #1a7a34; }
  .fail { background: #fde0de; color: #b3261e; }
  .summary { margin-top: 10px; font-size: 13px; background: #f6f6f6; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; }
  .summary.err { background: #fdf2f1; color: #8a2018; font-family: ui-monospace, monospace; font-size: 12px; }
  .why { font-size: 12px; color: #666; margin-top: 6px; }
  button { padding: 9px 18px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #999; background: #fff; }
  #verdict { margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 14px; display: none; }
  #verdict.good { background: #d4f4dd; }
  #verdict.bad { background: #fde0de; }
</style>
</head>
<body>
  <h1>가격 API 연결 체크</h1>
  <p class="sub">BTC 대시보드 앱과 별개인 독립 파일입니다. 파일을 브라우저로 열고 버튼만 누르면 됩니다(서버 불필요).
  <b>3~5번(Binance)이 핵심</b>입니다 — 캔들차트와 50주 이평선을 그리려면 Binance 데이터가 필요합니다.</p>

  <button id="runBtn" onclick="runChecks()">API 체크 실행</button>
  <div id="results" style="margin-top:18px;"></div>
  <div id="verdict"></div>

  <script>
    const fmt = (n) => Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
    const day = (ms) => new Date(ms).toISOString().slice(0, 10);

    const tests = [
      {
        id: "cg-price",
        title: "1. CoinGecko 현재가",
        why: "지금 앱이 쓰는 현재가 API입니다.",
        url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true",
        summarize: (d) => `BTC $${fmt(d.bitcoin.usd)} (24h ${d.bitcoin.usd_24h_change >= 0 ? "+" : ""}${d.bitcoin.usd_24h_change.toFixed(2)}%)`,
      },
      {
        id: "cg-chart",
        title: "2. CoinGecko 과거 가격 (365일)",
        why: "지금 앱이 쓰는 과거 데이터. 무료 플랜은 365일이 최대라 50주(350일) 이평선을 제대로 못 그립니다.",
        url: "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily",
        summarize: (d) => {
          const p = d.prices;
          return `${p.length}개 수신 · ${day(p[0][0])} ~ ${day(p[p.length - 1][0])}\n종가만 제공 (시가/고가/저가 없음 → 캔들차트 불가)`;
        },
      },
      {
        id: "bn-klines",
        title: "3. Binance 과거 캔들 1000일 ★핵심",
        why: "성공하면 캔들차트 + 50주 이평선 + 불마켓밴드 + 2년 차트가 전부 가능해집니다.",
        url: "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000",
        summarize: (d) => {
          const last = d[d.length - 1];
          return `${d.length}일치 수신 · ${day(d[0][0])} ~ ${day(last[0])}\n최근 캔들 → 시가 $${fmt(last[1])} / 고가 $${fmt(last[2])} / 저가 $${fmt(last[3])} / 종가 $${fmt(last[4])}\nOHLC 전부 제공 → 캔들차트 가능 ✓\n${d.length >= 350 ? "350일 이상 → 50주 이평선 계산 가능 ✓" : "⚠ 350일 미만 → 50주 이평선 불가"}`;
        },
      },
      {
        id: "bn-mirror",
        title: "4. Binance 공개 데이터 미러 (예비 경로)",
        why: "3번이 지역 차단으로 막힐 경우를 대비한 대체 주소입니다. 3번이 되면 이건 실패해도 상관없습니다.",
        url: "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=1000",
        summarize: (d) => `${d.length}일치 수신 · ${day(d[0][0])} ~ ${day(d[d.length - 1][0])}`,
      },
      {
        id: "bn-ticker",
        title: "5. Binance 현재가",
        why: "3번이 되면 현재가도 Binance로 통일할 수 있습니다.",
        url: "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT",
        summarize: (d) => `BTC $${fmt(d.lastPrice)} (24h ${Number(d.priceChangePercent) >= 0 ? "+" : ""}${Number(d.priceChangePercent).toFixed(2)}%)`,
      },
    ];

    const results = {};

    function renderSkeleton() {
      document.getElementById("verdict").style.display = "none";
      document.getElementById("results").innerHTML = tests.map(t => `
        <div class="test">
          <h2>${t.title}</h2>
          <div class="url">${t.url}</div>
          <span class="status pending" id="status-${t.id}">대기 중</span>
          <div class="why">${t.why}</div>
          <div class="summary" id="out-${t.id}" style="display:none;"></div>
        </div>
      `).join("");
    }

    async function runOne(test) {
      const statusEl = document.getElementById(`status-${test.id}`);
      const outEl = document.getElementById(`out-${test.id}`);
      statusEl.textContent = "요청 중...";
      statusEl.className = "status pending";
      const started = performance.now();
      try {
        const res = await fetch(test.url);
        const ms = Math.round(performance.now() - started);
        if (!res.ok) {
          statusEl.textContent = `실패 (HTTP ${res.status}, ${ms}ms)`;
          statusEl.className = "status fail";
          outEl.className = "summary err";
          outEl.style.display = "block";
          outEl.textContent = (await res.text()).slice(0, 600);
          results[test.id] = false;
          return;
        }
        const data = await res.json();
        statusEl.textContent = `성공 (${ms}ms)`;
        statusEl.className = "status ok";
        outEl.className = "summary";
        outEl.style.display = "block";
        try {
          outEl.textContent = test.summarize(data);
        } catch {
          outEl.textContent = JSON.stringify(data).slice(0, 400);
        }
        results[test.id] = true;
      } catch (e) {
        const ms = Math.round(performance.now() - started);
        statusEl.textContent = `요청 자체 실패 (${ms}ms)`;
        statusEl.className = "status fail";
        outEl.className = "summary err";
        outEl.style.display = "block";
        outEl.textContent = String(e) + "\n\n(네트워크 차단, 지역 제한, CORS, 또는 오프라인일 수 있습니다.)";
        results[test.id] = false;
      }
    }

    function renderVerdict() {
      const el = document.getElementById("verdict");
      const binanceOk = results["bn-klines"];
      const mirrorOk = results["bn-mirror"];
      el.style.display = "block";
      if (binanceOk || mirrorOk) {
        el.className = "good";
        el.innerHTML = `<b>결론: 캔들차트 구현 가능합니다.</b><br>` +
          `${binanceOk ? "Binance 기본 주소" : "예비 미러 주소"}가 정상 작동합니다. ` +
          `이 결과를 그대로 알려주시면 캔들차트 + 50주 이평선 + 불마켓밴드로 다시 만들겠습니다.`;
      } else {
        el.className = "bad";
        el.innerHTML = `<b>결론: Binance가 막혔습니다.</b><br>` +
          `이 경우 캔들차트와 50주 이평선은 CoinGecko만으로는 불가능합니다. ` +
          `결과를 알려주시면 다른 무료 소스를 찾아보겠습니다.`;
      }
    }

    async function runChecks() {
      renderSkeleton();
      for (const t of tests) await runOne(t);
      renderVerdict();
    }
  </script>
</body>
</html>
